[package]
name = "ez_render"
description = "wgpu renderer for EZ2DEMOSCENE"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ez_core.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
image.workspace = true
gltf.workspace = true
tobj.workspace = true
anyhow.workspace = true
log.workspace = true
pollster.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Same naga as wgpu uses, with every backend, to check the shaders translate
# for D3D12 (HLSL), Metal (MSL) and WebGL2 (GLSL ES) on any host.
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "msl-out", "glsl-out"] }
