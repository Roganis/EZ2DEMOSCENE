[package]
name = "ez_app"
description = "EZ2DEMOSCENE editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ez2demoscene"
path = "src/main.rs"

[dependencies]
ez_core.workspace = true
ez_render.workspace = true
ez_export.workspace = true
wgpu.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-snarl.workspace = true
image.workspace = true
rfd.workspace = true
anyhow.workspace = true
log.workspace = true
serde_json.workspace = true
glam.workspace = true
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }
rodio = { workspace = true, features = ["playback", "symphonia-all"] }
# Microphone / line-in for the live music preview (same version rodio uses).
cpal = "0.17"
env_logger.workspace = true
directories.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement",
    "HtmlAudioElement", "HtmlMediaElement", "Blob", "BlobPropertyBag", "Url", "Navigator",
    "Storage", "MediaQueryList", "Location", "UrlSearchParams", "console",
    "MediaDevices", "MediaStream", "MediaStreamConstraints", "AudioContext",
    "BaseAudioContext", "AnalyserNode", "AudioNode", "MediaStreamAudioSourceNode",
] }
idb = "0.6"
console_error_panic_hook = "0.1"
