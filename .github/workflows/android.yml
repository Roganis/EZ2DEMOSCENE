name: Android APK

# Wraps the WebAssembly build in the Capacitor app (android-app/) and builds
# an APK on every push (any branch) and pull request, uploaded as a workflow
# artifact. So there is always a fixed download link, the newest APK is also
# published as a rolling prerelease:
#   android-latest   the newest build of main
#   android-preview  the newest build of any other branch (work in progress)
# Tagged releases (v*) also get a signed release APK attached, provided these
# repository secrets exist:
#   ANDROID_KEYSTORE_BASE64  base64 of the .jks keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time; a newer push replaces a running build.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Build web app
        working-directory: web
        run: trunk build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships the Android SDK (ANDROID_HOME, licenses accepted);
      # Gradle installs any missing platform/build-tools itself.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - name: Install Capacitor
        working-directory: android-app
        run: npm ci
      - name: Build debug APK
        working-directory: android-app
        run: npm run build:debug
      - uses: actions/upload-artifact@v4
        with:
          name: ez2demoscene-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk

      - name: Publish rolling prerelease
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG=android-latest; TITLE="Android APK (latest main)"
          else
            TAG=android-preview; TITLE="Android APK (preview: $GITHUB_REF_NAME)"
          fi
          APK="$RUNNER_TEMP/ez2demoscene-debug.apk"
          cp android-app/android/app/build/outputs/apk/debug/*.apk "$APK"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Debug APK built from \`$GITHUB_REF_NAME\` at ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)). Updated automatically on every push."

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android-app/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/ez2demoscene-${GITHUB_REF_NAME}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/android/app/build/outputs/apk/debug/*.apk
            ez2demoscene-*.apk
          fail_on_unmatched_files: false
