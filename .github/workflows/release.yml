name: Release

# Builds installable archives for every platform. Windows and Linux archives
# include ffmpeg (GPL build from BtbN/FFmpeg-Builds) so video/GIF export works
# out of the box.
#   push a tag like v0.2.0   attached to that GitHub release
#   push to main             published as the rolling `desktop-latest` prerelease
#   run by hand              kept as workflow artifacts only
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to main replaces a running build; tag builds always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: ez2demoscene
            ffmpeg: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          - os: windows-latest
            name: windows-x86_64
            exe: ez2demoscene.exe
            ffmpeg: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          - os: macos-latest
            name: macos-arm64
            exe: ez2demoscene
            ffmpeg: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release -p ez_app
      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          D=dist/EZ2DEMOSCENE-${{ matrix.name }}
          mkdir -p "$D"
          cp target/release/${{ matrix.exe }} "$D/"
          cp -r assets "$D/"
          # The model and texture libraries are built into the executable
          # (their licences stay).
          rm -f "$D/assets/models/library.zip" "$D/assets/textures/texture_library.zip"
          cp README.md LICENSE "$D/"
          cp docs/manual/EZ2DEMOSCENE_User_Manual.pdf "$D/"
      - name: Bundle ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o ff.tar.xz "${{ matrix.ffmpeg }}"
          tar -xf ff.tar.xz
          cp ffmpeg-*/bin/ffmpeg dist/EZ2DEMOSCENE-${{ matrix.name }}/
          cp ffmpeg-*/LICENSE.txt dist/EZ2DEMOSCENE-${{ matrix.name }}/FFMPEG_LICENSE.txt || true
      - name: Bundle ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.ffmpeg }}" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = Get-ChildItem -Recurse -Filter ffmpeg.exe ff | Select-Object -First 1
          Copy-Item $bin.FullName "dist/EZ2DEMOSCENE-${{ matrix.name }}/"
      # DirectX 12 shader compiler. Without it wgpu falls back to FXC, which
      # can take practically forever on the raymarch shaders. wgpu loads
      # dxcompiler.dll from the app folder.
      - name: Bundle DXC (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo microsoft/DirectXShaderCompiler --pattern 'dxc_*.zip' --dir dxc
          ZIP=$(ls dxc/dxc_*.zip | grep -vi pdb | head -n1)
          7z x "$ZIP" -odxc/x > /dev/null
          D=dist/EZ2DEMOSCENE-${{ matrix.name }}
          cp dxc/x/bin/x64/dxcompiler.dll dxc/x/bin/x64/dxil.dll "$D/"
          cp dxc/x/LICENSE-MIT.txt "$D/DXC_LICENSE.txt" 2>/dev/null || cp dxc/x/LICENSE* "$D/" 2>/dev/null || true
      - name: macOS note
        if: runner.os == 'macOS'
        run: echo "For video export on macOS install ffmpeg with 'brew install ffmpeg'." > dist/EZ2DEMOSCENE-${{ matrix.name }}/FFMPEG.txt
      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a EZ2DEMOSCENE-${{ matrix.name }}.zip EZ2DEMOSCENE-${{ matrix.name }}
          else
            tar -czf EZ2DEMOSCENE-${{ matrix.name }}.tar.gz EZ2DEMOSCENE-${{ matrix.name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: EZ2DEMOSCENE-${{ matrix.name }}
          path: dist/EZ2DEMOSCENE-${{ matrix.name }}.*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EZ2DEMOSCENE-${{ matrix.name }}.*

  # Newest build of main, at a fixed download link.
  latest:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: EZ2DEMOSCENE-*
          merge-multiple: true
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=desktop-latest
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" out/* --prerelease --target "$GITHUB_SHA" \
            --title "Desktop builds (latest main)" \
            --notes "Windows, Linux and macOS builds of \`main\` at ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)). Updated automatically on every push to main. On macOS, install ffmpeg with \`brew install ffmpeg\` for video export."
